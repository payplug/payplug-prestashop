name: PR Type of Change

on:
  pull_request:
    branches:
      - '**'
    types: [opened, edited, reopened, synchronize]

jobs:
  check-type-of-change:
    name: Validate type of change is selected
    runs-on: ubuntu-latest
    steps:
      - name: Check that at least one "Type of Change" box is checked
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Strip carriage returns (GitHub can send \r\n) then extract the section
          section=$(printf '%s' "$PR_BODY" | tr -d '\r' | awk '
            /^## Type of Change/ { found=1; next }
            found && /^---/      { exit }
            found && /^## /      { exit }
            found                { print }
          ')

          echo "--- Extracted section ---"
          printf '%s\n' "$section"
          echo "-------------------------"

          # Match both formats: "[x] ..." (new) and "- [x] ..." (old)
          # The ^[-*]? prefix avoids matching the HTML comment <!-- ... [x] ... -->
          if printf '%s' "$section" | grep -qE '^[-*]?\s*\[[xX]\]'; then
            echo "Type of Change: at least one box is checked."
          else
            echo "::error::You must check at least one box in the 'Type of Change' section of the PR description."
            exit 1
          fi
