name: Auto-tag & Pre-release RC

'on':
  create:

jobs:
  # -----------------------------------------------------------------------
  # 1. APPLY RELEASE — update version files from the branch name, before
  #    any PR exists (avoids a mid-PR commit that would re-trigger the
  #    whole CI suite via a "synchronize" event — see github-actions.yml)
  # -----------------------------------------------------------------------
  apply-release:
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: payplug/template-ci/.github/workflows/presta-apply-release.yml@main
    with:
      ref: ${{ github.ref_name }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------------------
  # 2. CREATE RC0 TAG
  # -----------------------------------------------------------------------
  create-rc0-tag:
    needs: apply-release
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: payplug/template-ci/.github/workflows/auto_tag_rc.yml@main
    secrets: inherit


  create-rc-prerelease:
    if: github.ref_type == 'tag' && contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Created as a draft so it stays invisible/unnotified until the zip
      # is actually attached (see "Publish RC pre-release" in presta-release.yml).
      # Must use RELEASE_TOKEN, not the default GITHUB_TOKEN: releases
      # created with GITHUB_TOKEN don't trigger other workflows, so the
      # downstream "release" event in presta-release.yml would never fire.
      - name: Create draft GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease \
            --draft