name: Prestashop — Release

on:
  push:
    branches:
      - master
      - develop
  release:
    types: [published]

jobs:
  # -----------------------------------------------------------------------
  # 1. BUILD QA ZIP — triggered on push to master
  # -----------------------------------------------------------------------
  build-qa-zip:
    name: Build QA zip
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: payplug/template-ci/.github/workflows/presta-zip-generation.yml@main
    with:
      php-version: '7.2'
      node-version: '20'
      env: qa
      ref: refs/heads/master
    secrets:
      api-payplug: ${{ secrets.PAYPLUG_API_QA }}
      api-payplug-retail: ${{ secrets.API_RETAIL_QA }}

  # -----------------------------------------------------------------------
  # 2. REUSE QA ARTIFACT — download from last release run and re-upload on develop push
  # -----------------------------------------------------------------------
  reuse-qa-artifact-develop:
    name: Reuse QA artifact from merged branch (develop)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Download most recent QA artifact from release CI
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: github-actions.yml
          name_is_regexp: true
          name: .*-qa
          path: artifact/

      - name: Flatten artifact directory
        run: |
          find artifact/ -mindepth 2 -maxdepth 2 -exec mv {} artifact/ \;
          find artifact/ -type d -empty -delete

      - name: Re-upload artifact on develop push
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifact-develop-${{ github.sha }}
          path: artifact/
          retention-days: 7

  # -----------------------------------------------------------------------
  # 3. CREATE GITHUB RELEASE — triggered on tag push
  # -----------------------------------------------------------------------
  create-github-release:
    name: Create GitHub Release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"
          CHANGELOG=$(awk "/^## Version ${VERSION}$/{found=1; next} found && /^## Version /{exit} found{print}" changelog.md)
          if [ -z "$CHANGELOG" ]; then
            echo "⚠️  No changelog entry found for version ${VERSION} in changelog.md" >&2
            CHANGELOG="No changelog entry found for version ${VERSION}."
          fi
          {
            echo "content<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Update release notes with changelog
        run: |
          gh release edit ${{ github.ref_name }} \
            --notes "${{ steps.changelog.outputs.content }}" \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------------------
  # 4. BUILD PROD ZIP + ATTACH TO RELEASE — triggered on release published
  # -----------------------------------------------------------------------
  build-prod-zip:
    name: Build prod zip
    needs: create-github-release
    if: github.event_name == 'release'
    uses: payplug/template-ci/.github/workflows/presta-zip-generation.yml@main
    with:
      php-version: '7.2'
      node-version: '20'
      env: prod
      ref: ${{ github.ref }}
    secrets:
      api-payplug: ${{ secrets.PAYPLUG_API_PROD }}
      api-payplug-retail: ${{ secrets.API_RETAIL_PROD }}
      github-token: ${{ secrets.GITHUB_TOKEN }}